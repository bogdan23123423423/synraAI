<script>
(function () {
  "use strict";
  var de = document.documentElement;
  var st = de.style;
  var lastErr = "";
  var t0 = Date.now();
  var goodH = 0, goodW = 0;

  /* ---------- Надёжная высота окна ----------
     Раньше высота запоминалась один раз при самом старте. Если окно просмотра
     (например, шторка в приложении Claude на iPhone) на этот момент ещё не
     получило размер, запоминался 0 — и весь интерфейс получал высоту 0 (остаётся
     только голубой фон). Теперь: нулевые/нелепые значения игнорируются (работает
     CSS-запас 100dvh), а размер пересчитывается, пока окно «устаканивается»,
     и при любом реальном изменении (поворот, split-view, смена окна, клавиатура
     на Android). На iPhone клавиатура размер окна не меняет, поэтому всё как раньше. */
  function measure() {
    var h = Math.max(window.innerHeight || 0, de.clientHeight || 0);
    var w = Math.max(window.innerWidth || 0, de.clientWidth || 0);
    return { h: Math.ceil(h), w: Math.ceil(w) };
  }
  function applyHeight() {
    var m = measure();
    if (m.h < 120 || m.w < 100) return;
    if (m.h === goodH && m.w === goodW) return;
    goodH = m.h; goodW = m.w;
    st.setProperty("--app-height", m.h + "px");
    st.setProperty("--app-offset-top", "0px");
  }
  applyHeight();
  var ev = ["resize", "orientationchange", "pageshow", "load", "focus"];
  for (var i = 0; i < ev.length; i++) window.addEventListener(ev[i], function () { applyHeight(); setTimeout(applyHeight, 120); setTimeout(applyHeight, 450); });
  document.addEventListener("visibilitychange", function () { applyHeight(); });
  var waits = [30, 90, 200, 400, 800, 1400, 2200, 3500, 6000];
  for (var k = 0; k < waits.length; k++) setTimeout(applyHeight, waits[k]);
  try { if (window.ResizeObserver) new ResizeObserver(function () { applyHeight(); }).observe(de); } catch (_) {}
  try { if (window.visualViewport) window.visualViewport.addEventListener("resize", function () { applyHeight(); }); } catch (_) {}

  /* ---------- Тёмная тема на заставке ---------- */
  try {
    var raw = window.localStorage && window.localStorage.getItem("synra_state_v1");
    if (raw && /"theme"\s*:\s*"dark"/.test(raw)) {
      de.className += " boot-dark";
    }
  } catch (_) {}

  /* ---------- Если приложение не запустилось — показываем причину, а не пустоту ---------- */
  function note(msg) {
    msg = String(msg || "").slice(0, 240);
    if (msg && !/ResizeObserver/i.test(msg)) lastErr = msg;
  }
  window.addEventListener("error", function (e) {
    try {
      if (e && e.target && e.target !== window && e.target.tagName) return;
      note((e && e.message) + (e && e.lineno ? " (стр. " + e.lineno + ")" : ""));
    } catch (_) {}
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    try { var r = e && e.reason; note((r && r.message) || r); } catch (_) {}
  });
  function mounted() { return !!document.querySelector(".shell"); }
  function showFail() {
    var r = document.getElementById("root");
    if (!r || mounted()) return;
    var d = lastErr ? '<div style="font-size:12px;color:#5F6368;max-width:320px;word-break:break-word;">' + lastErr.replace(/[<>&]/g, "") + "</div>" : "";
    r.innerHTML =
      '<div id="boot-splash"><div class="bs-title">Не удалось запустить Synra</div>' +
      '<div class="bs-sub">Закройте и откройте файл ещё раз. Если повторится — сделайте скриншот этого экрана.</div>' + d +
      '<button class="bs-btn" onclick="location.reload()">Повторить</button></div>';
  }
  var shown = false;
  var poll = setInterval(function () {
    if (mounted()) { clearInterval(poll); return; }
    if (!shown && Date.now() - t0 > 9000) { shown = true; showFail(); }
  }, 400);
  setTimeout(function () { clearInterval(poll); }, 120000);
})();

</script>
